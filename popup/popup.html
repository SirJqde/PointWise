<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointWise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>PointWise</h1>
    </div>
    <div class="header-actions">
      <button id="settings-btn" class="settings-trigger" type="button" aria-controls="settings-panel" aria-expanded="false">Settings</button>
      <button id="power-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="PointWise"></button>
    </div>
  </header>
  <main>
    <section id="off-panel" class="off-panel">
      <h2>PointWise is off</h2>
      <p class="muted">Turn it on to get guidance on the page you’re visiting.</p>
    </section>

    <section id="task-panel" hidden>
      <div class="modes" role="group" aria-label="How to start">
        <button id="page-mode" type="button" aria-pressed="true">Current page</button>
        <button id="search-mode" type="button" aria-pressed="false">Find a website</button>
      </div>
      <form id="task-form" class="task-form">
        <label class="task-heading" for="task-input">What can I help you do?</label>
        <p id="page-context" class="page-context"></p>
        <div class="composer">
          <textarea id="task-input" rows="3" placeholder="Describe what you want to do" aria-describedby="page-context"></textarea>
          <div class="composer-footer">
            <span class="keyboard-hint" aria-hidden="true"><kbd>Enter</kbd> to start</span>
            <button id="start-btn" class="primary-button" type="submit">Guide this page</button>
          </div>
        </div>
      </form>
    </section>

    <form id="context-panel" class="panel-form" hidden>
      <label id="context-question" class="task-heading" for="context-answer"></label>
      <textarea id="context-answer" rows="2" placeholder="Add a little more detail"></textarea>
      <div class="button-row">
        <button id="context-submit" class="primary-button" type="submit">Continue</button>
        <button id="context-skip" class="text-button" type="button">Skip</button>
      </div>
    </form>

    <section id="settings-panel" hidden>
      <div class="section-heading">
        <h2>Settings</h2>
        <button id="settings-back" class="text-button" type="button">Back</button>
      </div>
      <form id="key-form" class="panel-form">
        <label for="api-key">Gemini API key</label>
        <p id="key-help" class="muted">Used for AI guidance and saved in this browser.</p>
        <input type="password" id="api-key" aria-describedby="key-help" autocomplete="off">
        <button class="primary-button" type="submit">Save key</button>
      </form>
    </section>

    <div id="status-row" class="status-row" hidden>
      <p id="status-message" role="status" aria-live="polite"></p>
      <button id="status-action" class="text-button" type="button" hidden></button>
    </div>
    <section id="results-section" class="results" aria-label="Website results" hidden>
      <h2 id="results-heading"></h2>
      <ul id="results-list"></ul>
    </section>
  </main>
  <script src="./popup.ts" type="module"></script>
</body>
</html>
