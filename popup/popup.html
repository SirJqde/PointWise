<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GuideCursor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-wrap">
      <span class="logo">🧭</span>
      <h1>GuideCursor</h1>
    </div>
    <div class="header-right">
      <span id="status-indicator" class="status-indicator dormant" title="Dormant"></span>
      <button id="toggle-btn" class="toggle-btn">Start</button>
    </div>
  </header>

  <!-- Prompt -->
  <textarea id="task-input" rows="3"
    placeholder="e.g. Book a bus ticket&#10;Renew driving licence India&#10;File income tax return">
  </textarea>

  <button id="search-btn" class="search-btn">Search</button>

  <!-- Result box — hidden until a site is found -->
  <div id="result-box" class="result-box hidden">
    <div class="result-header">
      <span id="result-badge" class="result-badge">✅ Verified</span>
      <div class="score-wrap">
        <div class="score-track"><div id="score-fill" class="score-fill"></div></div>
        <span id="score-num" class="score-num"></span>
      </div>
    </div>
    <a id="result-link" class="result-link" href="#" target="_blank" rel="noopener noreferrer">
      <span id="result-domain"></span>
      <span class="ext-icon">↗</span>
    </a>
    <button id="go-btn" class="go-btn">Open &amp; start guiding</button>
  </div>

  <!-- Active status -->
  <div id="status-bar" class="status-bar hidden">
    <span class="pulse-dot"></span>
    <span id="status-text" class="status-text">Guiding…</span>
  </div>

  <!-- Hidden API key gear -->
  <footer>
    <button id="key-btn" class="key-btn" title="Gemini API key">⚙</button>
    <div id="key-row" class="key-row hidden">
      <input type="password" id="api-key" placeholder="AIzaSy…" autocomplete="off" />
      <button id="save-key" class="save-key-btn">Save</button>
    </div>
  </footer>

  <script src="./popup.ts" type="module"></script>
</body>
</html>
