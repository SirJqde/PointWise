<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PointWise</title>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/assets/session-graph-Cc_7cEmY.js"></script>
  <script type="module" crossorigin src="/assets/popup-BV7W7WN6.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/popup-BEKky8OJ.css">
</head>
<body>

  <!-- Header: ONLY PointWise + power switch visible initially when OFF -->
  <header id="app-header">
    <div class="logo-wrap">
      <span class="logo">⬡</span>
      <h1>PointWise</h1>
    </div>
    <div class="header-right">
      <span id="status-indicator" class="status-indicator dormant" title="PointWise is Off"></span>
      <button
        id="power-switch"
        class="power-switch"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Toggle PointWise power"
        title="Turn PointWise ON"
      >
        <span class="switch-track">
          <span class="switch-thumb">
            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M12 3v8" />
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            </svg>
          </span>
        </span>
      </button>
    </div>
  </header>

  <!-- Context follow-up panel: opens automatically if initial prompt lacked details -->
  <section id="context-panel" class="context-panel hidden">
    <div class="context-badge">NEED MORE CONTEXT</div>
    <p id="context-question" class="context-question"></p>
    <textarea
      id="context-answer"
      rows="3"
      placeholder="Add details (e.g. Student pass, Pune to Mumbai on 26 Nov, or product name)…"
    ></textarea>
    <div class="action-row">
      <button id="context-submit-btn" class="search-btn" type="button">Continue ▶</button>
      <button id="context-skip-btn" class="guide-current-btn" type="button">Skip</button>
    </div>
  </section>

  <!-- Active panel: prompt dialogue, search bar & results ONLY open once turned ON -->
  <section id="active-panel" class="active-panel hidden">
    <div id="status-bar" class="status-bar">
      <span class="pulse-dot"></span>
      <span id="status-text" class="status-text">Ready — enter a task or website</span>
    </div>

    <label for="task-input" class="prompt-label">What do you want to do?</label>
    <textarea
      id="task-input"
      rows="3"
      placeholder="e.g. Apply for a BMTC bus pass&#10;Book a train ticket from Delhi to Agra&#10;Renew driving licence"
    ></textarea>

    <div class="action-row">
      <button id="search-btn" class="search-btn" type="button">Search Web</button>
      <button id="guide-current-btn" class="guide-current-btn" type="button" title="Scan and guide on the currently open tab">
        Guide Page
      </button>
    </div>

    <!-- Keywords extracted pill row -->
    <div id="keywords-row" class="keywords-row hidden"></div>

    <!-- Google-style search results container -->
    <div id="results-container" class="results-container hidden"></div>

    <!-- Footer / Gemini API key settings (only shown when ON) -->
    <footer>
      <button id="key-btn" class="key-btn" type="button" title="Configure Gemini API key">⚙ API Key</button>
      <div id="key-row" class="key-row hidden">
        <input type="password" id="api-key" placeholder="AIzaSy…" autocomplete="off" />
        <button id="save-key" class="save-key-btn" type="button">Save</button>
      </div>
    </footer>
  </section>

</body>
</html>
